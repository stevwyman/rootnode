{% load i18n %}
{% if story_mentions %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h5 class="mb-0">{% trans "Erwähnt in" %}</h5>
    </div>
    <ul class="list-group list-group-flush">
        {% for page in story_mentions %}
            <li class="list-group-item">
                <a href="{% url 'stories:detail' tree_id=tree_id pk=page.pk %}">{{ page.title }}</a>
                <span class="badge text-bg-light border ms-1">{{ page.get_kind_display }}</span>
            </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
