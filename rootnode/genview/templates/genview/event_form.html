{% extends "genview/base.html" %}

{% block title %}Ereignis hinzufügen{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        Neues Ereignis für {{ person.given_name }} {{ person.surname }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'genview:individual-detail' tree_id=tree_id pk=person.pk %}" class="btn btn-outline-secondary">Abbrechen</a>
                            <button type="submit" class="btn btn-success">Ereignis speichern</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
