{% extends "genview/base.html" %}

{% block title %}
    {% if object %}Quelle bearbeiten{% else %}Neue Quelle{% endif %}
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">{% if object %}Quelle bearbeiten{% else %}Neue Quelle anlegen{% endif %}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'genview:source-list' tree_id=tree_id %}" class="btn btn-outline-secondary">Abbrechen</a>
                            <button type="submit" class="btn btn-success">Speichern</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
