{% extends "genview/base.html" %}
{% load static i18n %}

{% block title %}{% trans "Familienbaum" %}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/family-chart@latest/dist/styles/family-chart.css">



{% endblock %}

{% block content %}
<div class="container my-4">
    <h2 class="mb-3">{% trans "Familienbaum" %}</h2>

    <!-- Container, in den D3 das Diagramm rendert -->
    <div id="FamilyChart"
         class="f3"
         style="width:100%;height:900px;margin:auto;background-color:rgb(33,33,33);color:#fff;">
    </div>

    <!-- Platz für Fehlermeldungen / “Mehr laden” -->
    <div id="chart-message" class="mt-3"></div>
</div>
{% endblock %}

{% block extra_js %}
<!-- D3 – das `family‑chart`‑Paket baut intern auf D3 v7 auf -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<!-- UMD‑Build von family‑chart (statt `FamilyChart` das globale Objekt `f3`) -->
<script type="module" src="{% static 'js/family-chart.umd.min.js' %}"></script>

<script type="module">
document.addEventListener('DOMContentLoaded', function () {
    // -------------------------------------------------------------
    // 1. Daten aus dem Django‑Template
    // -------------------------------------------------------------
    const language     = "{{ LANGUAGE_CODE|lower }}";   // „de“ oder „en“
    const appName      = "genview";                     // Name deiner Django‑App
    const treeId       = {{ tree_id }};
    const individualId = {{ individual_id }};
    const startDepth   = 4;                              // initiale Rekursionstiefe

    // -------------------------------------------------------------
    // 2. Hilfs‑Funktionen
    // -------------------------------------------------------------
    const messageDiv = document.getElementById('chart-message');

    function showError(msg) {
        document.getElementById('FamilyChart').innerHTML = '';
        messageDiv.innerHTML = `<p class="text-danger">${msg}</p>`;
    }

    // URL‑Builder inklusive Sprach‑ und App‑Prefix
    function buildUrl(depth) {
        return `/${language}/${appName}/tree/${treeId}/individual/${individualId}/json/?max_depth=${depth}`;
    }

    // -------------------------------------------------------------
    // 3. Laden & Rendern des Baums
    // -------------------------------------------------------------
    function loadTree(depth) {
        // ggf. vorherige Meldungen entfernen
        messageDiv.innerHTML = '';
        document.getElementById('FamilyChart')
                .innerHTML = `<p class="text-muted">{% trans "Lade Baum …" %}</p>`;

        fetch(buildUrl(depth), { credentials: 'same-origin' })
            .then(resp => {
                if (!resp.ok) throw new Error(`Server‑Antwort ${resp.status}`);
                return resp.json();
            })
            .then(data => {
                if (data.error) throw new Error(data.error);

                // ---------  *** RICHTIGER AUFRUF ***  ----------
                // `f3` ist das globale Objekt, das vom Skript bereitgestellt wird
                
                console.log(JSON.stringify(data))
                alert(JSON.stringify(data))

                const f3Chart = f3.createChart('#FamilyChart', data);
                // optional: falls du später Zoom‑/Pan‑Methoden brauchst:
                // f3Chart.zoomToFit();
                // ------------------------------------------------
                f3Chart.setCardHtml()
                    .setCardDisplay([["first name", "last name"]])

                f3Chart.updateTree({initial: true})

                // Wenn das Backend signalisiert, dass noch weitere Ebenen existieren,
                // zeigen wir einen „Mehr laden“-Button an.
                if (data.has_more) {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-outline-secondary mt-2';
                    btn.textContent = '{% trans "Mehr laden" %}';
                    btn.onclick = () => loadTree(depth + 2);   // 2 Ebenen nachladen
                    messageDiv.appendChild(btn);
                }
            })
            .catch(err => {
                console.error(err);
                showError('{% trans "Baum konnte nicht geladen werden." %}<br>' + err.message);
            });
    }

    // Erstes Laden mit der definierten Start‑Tiefe
    loadTree(startDepth);
});
</script>
{% endblock %}
