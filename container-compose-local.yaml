networks:
  backend_net:
    name: genview_network

volumes:
  models_data:
    name: shared_ml_models
  genview_data:
    name: genview_data
  ollama_data:
    name: ollama_data
  color_data:
    name: color_data

services:
  rootnode:
    image: localhost/rootnode:latest
    container_name: rootnode
    restart: unless-stopped
    volumes:
      - genview_data:/data/genview:z
    ports:
      - 8010:8003
    networks:
      - backend_net
    env_file:
      - .env
