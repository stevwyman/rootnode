# .github/workflows/docker-build.yml
name: CI / CD – Build & Push Docker Image

# --------------------------------------------------------------
# 1️⃣  Trigger
# --------------------------------------------------------------
on:
  push:
    branches:
      - main          # bei jedem Push auf main (Produktions-Branch)
      - develop       # optional: auch für develop-Branch
    tags:
      - 'v*'          # bei Release-Tags, z. B. v1.2.3
  pull_request:
    branches:
      - main
      - develop

# --------------------------------------------------------------
# 2️⃣  Jobs
# --------------------------------------------------------------
jobs:
  # ------------------------------------------------------------
  # 2.1  Test-Job – läuft zuerst, damit das Image nur bei
  #       erfolgreich abgeschlossenen Tests gebaut wird.
  # ------------------------------------------------------------
  tests:
    name: Run Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Cache pip packages (schnellerer nächste Run)
      # --------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # --------------------------------------------------------
      # Set up Python (gleiche Version wie im Docker-File)
      # --------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Run migrations (in-memory SQLite) & Django tests
      # --------------------------------------------------------
      - name: Run Django tests
        env:
          # ------------------- Django Settings -------------------
          DJANGO_SETTINGS_MODULE: "rootnode.settings"   # <-- passe ggf. an
          SECRET_KEY: "ci-secret-key"                  # Dummy-Key für Tests
          DEBUG: "true"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          # ------------------- DB (SQLite) --------------------
          # Für PostgreSQL-Tests würdest du hier die Service-Variablen
          # setzen (z. B. DATABASE_URL=postgres://...)
        run: |
          # Datenbank-Migrations ausführen (erzeugt die SQLite-DB)
          python manage.py migrate --noinput
          # Tests starten – du kannst das Test-Label anpassen
          python manage.py test --noinput

  # ------------------------------------------------------------
  # 2.2  Build & Push Job – startet nur, wenn "tests" erfolgreich
  # ------------------------------------------------------------
  build_and_push:
    name: Build & push Docker image
    needs: tests                     # <-- wartet bis tests fertig sind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # --------------------------------------------------------
    # 2.2.1  Environment – definiere Variablen, die im Build
    #        verwendet werden (z. B. Django-Settings)
    # --------------------------------------------------------
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/rootnode   # -> Docker-Hub-Repo
      # Tag-Varianten:
      #   latest            (immer)
      #   sha-${GITHUB_SHA} (eindeutig pro Commit)
      #   branch-${GITHUB_REF_NAME} (z. B. branch-develop)
      LATEST_TAG: latest
      SHA_TAG: sha-${{ github.sha }}
      BRANCH_TAG: branch-${{ github.ref_name }}

    steps:
      # --------------------------------------------------------
      # 2.2.2  Checkout (wir brauchen den Code für den Build)
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2.2.3  Login to Docker Hub
      # --------------------------------------------------------
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # 2.2.4  Set up Docker Buildx (multi-arch, caching)
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # 2.2.5  Optional – restore a previous build cache
      # --------------------------------------------------------
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # --------------------------------------------------------
      # 2.2.6  Build & push the image (multiple tags)
      # --------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile                     # Pfad zu deinem Docker-File (standard)
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: linux/arm64, linux/amd64

      # --------------------------------------------------------
      # 2.2.7  (Optional) – ausgeben, welcher Tag jetzt live ist
      # --------------------------------------------------------
      - name: Show image info
        run: |
          echo "✅ Image ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }} pushed."
          echo "   – SHA tag: ${{ env.SHA_TAG }}"
          echo "   – Branch tag: ${{ env.BRANCH_TAG }}"